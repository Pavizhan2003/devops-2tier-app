version: '3.8'

services:
  web:
    build: .
    container_name: devops-web-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: devops-redis-db
    ports:
      - "6379:6379"
    restart: unless-stopped