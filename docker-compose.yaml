services:
  web:
    build: .
    container_name: devops-web-app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=devopspassword
      - DB_NAME=taskdb
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: devops-postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devopspassword
      POSTGRES_DB: taskdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  pgdata: